<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payesh | پایش</title>
<style>
:root{--bg:#0A0B09;--card:#171A14;--accent:#C6F432;--onacc:#111700;--paper:#F3F4EE;--ink:#14160F;--orange:#FFB23E;--violet:#B9A7FF;--muted:#8B9084;--line:rgba(255,255,255,.08);--ok:#3A9E00;--bad:#FF6B5E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:#fff;font-family:Vazirmatn,"Segoe UI",Tahoma,system-ui,sans-serif}
button,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
.side{border-inline-end:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px}
.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:12px;background:var(--accent);color:var(--onacc);display:grid;place-items:center;font-weight:900}
.dev{background:var(--card);border:1px solid transparent;border-radius:18px;padding:12px 14px;cursor:pointer;text-align:start;width:100%}
.dev.sel{border-color:var(--accent)}
.dev b{display:block}.dev small{color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-inline-end:6px}
.dot.on{background:var(--accent)}
.btn{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--onacc);border:0;font-weight:700}
main{display:flex;justify-content:center;padding:18px}
.phone{width:100%;max-width:480px;background:var(--bg);border:1px solid var(--line);border-radius:34px;position:relative;overflow:hidden;min-height:calc(100vh - 36px)}
.screen{padding:16px 16px 120px;display:flex;flex-direction:column;gap:10px}
h1{font-size:34px;line-height:1.25;margin:6px 0;font-weight:800;white-space:pre-line}
.tabs{display:flex;gap:4px;background:var(--card);border-radius:20px;padding:4px;overflow-x:auto}
.tab{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:11px 18px;border-radius:16px;cursor:pointer;white-space:nowrap}
.tab.sel{background:var(--accent);color:var(--onacc)}
.card{background:var(--card);border-radius:24px;padding:16px}
.row{background:var(--card);border-radius:22px;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.row.hot{background:var(--accent);color:var(--onacc)}
.row.hot .sub{color:rgba(17,23,0,.65)}
.av{width:48px;height:48px;border-radius:14px;background:#2A2F24;color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.row.hot .av{background:rgba(17,23,0,.15);color:var(--onacc)}
.grow{flex:1;min-width:0}
.grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:11px}
.num{text-align:end;white-space:nowrap}.num b{font-size:17px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.bd{font-size:10.5px;font-weight:700;border-radius:10px;padding:2px 8px;background:rgba(198,244,50,.16);color:var(--accent)}
.bd.v{background:rgba(185,167,255,.16);color:var(--violet)}.bd.o{background:rgba(255,178,62,.16);color:var(--orange)}
.bd.g{background:rgba(255,255,255,.08);color:var(--muted)}.bd.r{background:rgba(255,107,94,.16);color:var(--bad)}
.row.hot .bd{background:rgba(17,23,0,.12);color:var(--onacc)}
.conn{margin:-4px 8px 0;background:#0F110D;border-radius:0 0 18px 18px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:12px}
.conn .u{color:var(--orange);word-break:break-all;font-size:11px}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
.bar{position:sticky;bottom:12px;margin:0 12px 12px;background:#000;border:1px solid var(--line);border-radius:28px;padding:10px 10px 10px 20px;display:flex;align-items:center;gap:10px}
.pill{background:var(--accent);color:var(--onacc);font-weight:800;border-radius:20px;padding:12px 18px;font-size:14px}
.pill.off{background:#2A2F24;color:var(--muted)}
.pillsw{display:flex;gap:6px;flex-wrap:wrap}
.pillsw button{border:0;border-radius:14px;padding:8px 14px;background:var(--card);color:var(--muted);font-weight:700;cursor:pointer}
.pillsw button.sel{background:var(--accent);color:var(--onacc)}
.prog{height:8px;border-radius:6px;background:#2A2F24;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}
.warn{background:rgba(255,178,62,.12);color:var(--orange);border-radius:18px;padding:10px 14px;font-size:12px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border:0}
.score{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;margin:0 auto}
.score div{width:94px;height:94px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:30px;font-weight:800}
.empty{text-align:center;color:var(--muted);padding:40px 12px;line-height:2}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
dialog{background:var(--card);color:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog input{width:100%;margin:6px 0 12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:#0F110D;direction:ltr}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{border:0;border-bottom:1px solid var(--line)}.side .list{display:flex;gap:8px;overflow-x:auto}.dev{min-width:200px}main{padding:8px}.phone{border-radius:24px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">P</span>پایش</div>
    <div class="status" id="conn"></div>
    <div class="list" id="devs"></div>
    <button class="btn" id="cfgBtn">اتصال به API</button>
    <div class="sub">این صفحه فقط مشاهده است و هیچ فرمانی به گوشی نمی‌فرستد.</div>
  </aside>
  <main>
    <div class="phone">
      <div class="screen" id="screen"></div>
      <div class="bar" id="bar"></div>
    </div>
  </main>
</div>
<dialog id="cfg">
  <b>اتصال به سرور</b>
  <p class="sub">آدرس API و توکن مدیر فقط در همین مرورگر ذخیره می‌شوند.</p>
  <label class="sub">آدرس API (https://…)</label><input id="apiBase" placeholder="https://payeshgpt.onrender.com">
  <label class="sub">توکن مدیر</label><input id="apiTok" type="password">
  <div style="display:flex;gap:8px"><button class="btn pri" id="save">ذخیره و اتصال</button><button class="btn" id="close">بستن</button></div>
</dialog>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(2)+' GB';
const PORTS={443:'443 (HTTPS)',80:'80 (HTTP)',53:'53 (DNS)',853:'853 (DoT)',123:'123 (NTP)',5228:'5228 (Google/FCM)',993:'993 (IMAPS)',587:'587 (SMTP)',8080:'8080 (HTTP-alt)',1935:'1935 (RTMP)',0:'— (ping)'};
const port=p=>PORTS[p]||String(p);
const sum=a=>(a||[]).reduce((x,y)=>x+y,0);
const L=s=>'<span class="ltr">'+esc(s)+'</span>';
const S={api:localStorage.getItem('payeshApiBase')||'',tok:localStorage.getItem('payeshApiToken')||'',devices:[],sel:null,live:{},seq:0,age:null,empty:false,err:'',tab:0,exp:{},hmode:0,hfilter:0,busy:false};
const TABS=['زنده','تاریخچه','آمار سیستم','پاکسازی','آنتی‌ویروس'];

async function api(path){
  const r=await fetch(S.api+path,{headers:{Authorization:'Bearer '+S.tok},cache:'no-store'});
  if(!r.ok)throw new Error(r.status===401?'توکن مدیر اشتباه است':'HTTP '+r.status);
  return r.json();
}
async function loadDevices(){
  if(!S.api||!S.tok){return}
  try{const d=await api('/api/v1/devices');S.devices=(d.devices||[]).filter(x=>x.id);S.err='';
    if(!S.sel&&S.devices.length)select(S.devices[0].id);}
  catch(e){S.err=e.message}
  renderSide();
}
function select(id){S.sel=id;S.live={};S.seq=0;S.age=null;S.empty=false;S.exp={};renderSide();render()}
async function poll(){
  if(!S.sel||S.busy||document.hidden||!S.api||!S.tok)return;
  S.busy=true;
  try{
    const d=await api('/api/v1/live/'+encodeURIComponent(S.sel)+'?since='+S.seq);
    S.err='';S.age=d.age_ms==null?null:d.age_ms;S.empty=!!d.empty;
    if(d.data){Object.assign(S.live,d.data);S.seq=d.seq;render()}else{S.seq=d.seq||S.seq}
  }catch(e){S.err=e.message}
  S.busy=false;renderConn();
}
function online(){return S.age!=null&&S.age<10000}
function renderConn(){
  const el=$('#conn');
  if(!S.api||!S.tok)el.innerHTML='<span class="dot"></span>API تنظیم نشده';
  else if(S.err)el.innerHTML='<span class="dot"></span>'+esc(S.err);
  else if(!S.sel)el.innerHTML='<span class="dot"></span>دستگاهی ثبت نشده';
  else if(online())el.innerHTML='<span class="dot on"></span>پخش زنده';
  else el.innerHTML='<span class="dot"></span>منتظر گوشی…';
}
function ago(s){if(!s)return '—';const t=Date.parse(s);if(!t)return '—';const m=Math.round((Date.now()-t)/60000);return m<1?'همین الان':m<60?m+' دقیقه پیش':Math.round(m/60)+' ساعت پیش'}
function renderSide(){
  $('#devs').innerHTML=S.devices.map(d=>'<button class="dev '+(d.id===S.sel?'sel':'')+'" data-id="'+esc(d.id)+'"><b><span class="dot '+(d.id===S.sel&&online()?'on':'')+'"></span>'+esc(d.name)+'</b><small>'+esc(d.model||'')+' • '+ago(d.last_seen)+'</small></button>').join('')||'<div class="sub">هنوز گوشی‌ای گزارش نداده است.</div>';
  renderConn();
}
function wait(){
  const m=!S.sel?'گوشی انتخاب نشده است.':'منتظر گوشی هستم…<br>در اپ، «نمایش زندهٔ رابط در داشبورد» باید روشن باشد.<br>شروع پخش تا حدود ۱۰ ثانیه طول می‌کشد.';
  return '<div class="empty">'+m+'</div>';
}
function bd(t,c){return '<span class="bd '+(c||'')+'">'+esc(t)+'</span>'}

/* ---------- live ---------- */
function appRow(a){
  const b=[];
  if(a.dl)b.push(bd('دانلود '+fmt(a.r)+'/s'));
  if(a.fg===true)b.push(bd('پیش‌زمینه'));else if(a.fg===false){if(a.a)b.push(bd('پس‌زمینه','v'))}else if(a.a)b.push(bd('فعال'));
  if(!a.c.length&&S.live.traffic.run)b.push(bd('بدون ترافیک','g'));
  if(a.sys)b.push(bd('سیستمی','g'));
  if(a.out>0)b.push(bd('خارج از رصد '+fmt(a.out),'o'));
  let h='<div class="row '+(a.dl?'hot':'')+'" data-exp="'+a.uid+'"><div class="av">'+esc((a.label||'?').slice(0,1))+'</div><div class="grow"><b>'+esc(a.label)+'</b><div class="sub">'+L(a.pkg)+'</div><div class="badges">'+b.join('')+'</div></div><div class="num"><b>'+fmt(a.dn)+'</b><div class="sub">'+fmt(a.u)+'</div></div></div>';
  if(S.exp[a.uid]&&a.c.length)h+='<div class="conn">'+a.c.map(c=>'<div><div style="display:flex;justify-content:space-between;gap:8px"><span>'+L(c.d)+'</span><span style="color:'+(c.a?'#C6F432':'#8B9084')+'">'+(c.r>0?fmt(c.r)+'/s':'')+'</span></div><div class="sub">'+esc(c.pr)+' • '+L(port(c.p))+' • ↓ '+fmt(c.dn)+' ↑ '+fmt(c.u)+'</div>'+(c.url?'<div class="u">URL: '+L(c.url)+'</div>':'')+'</div>').join('')+'</div>';
  return h;
}
function sLive(){
  const t=S.live.traffic;if(!t)return wait();
  return '<h1>رصد زنده\nترافیک</h1>'+(t.stale?'<div class="warn">داده‌های ترافیک قدیمی است. برای نمایش زنده، برنامهٔ پایش را در لیست اخیر گوشی نگه دار (کاملاً نبند).</div>':'')+
  '<div class="card"><div class="sub">به</div><b style="font-size:17px">پایش خوش آمدی</b><div class="sub">'+(t.run?'فعال':'خاموش')+'</div><div class="kv" style="margin-top:10px"><span>کل دریافت</span><b>'+fmt(t.down)+'</b></div><div class="kv"><span>کل ارسال</span><b>'+fmt(t.up)+'</b></div><div class="sub" style="margin-top:6px">'+t.activeApps+' برنامه در ۵ ثانیهٔ اخیر ارتباط داشته‌اند</div></div>'+
  (t.apps.length?t.apps.map(appRow).join(''):'<div class="empty">'+(t.run?'هنوز ترافیکی ثبت نشده.':'رصد خاموش است. از خود گوشی «شروع رصد» را بزن.')+'</div>');
}

/* ---------- history ---------- */
function sHist(){
  const h=S.live.hist;if(!h)return wait();
  let body='';
  if(S.hmode===0){
    const list=h.apps.filter(a=>S.hfilter===0||(a.bgUp+a.bgDn)>0);
    const dn=sum(list.map(a=>a.fgDn+a.bgDn+a.unDn)),up=sum(list.map(a=>a.fgUp+a.bgUp+a.unUp));
    body='<div class="card"><div class="kv"><span>دریافت</span><b>'+fmt(dn)+'</b></div><div class="kv"><span>ارسال</span><b>'+fmt(up)+'</b></div><div class="kv"><span>برنامه‌ها</span><b>'+list.length+'</b></div></div>'+
    '<div class="pillsw"><button class="'+(S.hfilter===0?'sel':'')+'" data-hf="0">همه</button><button class="'+(S.hfilter===1?'sel':'')+'" data-hf="1">پس‌زمینه</button></div>'+
    list.map(a=>{const k='h'+a.pkg;const d=a.fgDn+a.bgDn+a.unDn,u=a.fgUp+a.bgUp+a.unUp;
      let r='<div class="row" data-expk="'+esc(k)+'"><div class="av">'+esc(a.label.slice(0,1))+'</div><div class="grow"><b>'+esc(a.label)+'</b><div class="badges">'+(a.fgDn+a.fgUp>0?bd('پیش‌زمینه '+fmt(a.fgDn+a.fgUp)):'')+(a.bgDn+a.bgUp>0?bd('پس‌زمینه '+fmt(a.bgDn+a.bgUp),'v'):'')+(a.sys?bd('سیستمی','g'):'')+'</div></div><div class="num"><b>'+fmt(d)+'</b><div class="sub">'+fmt(u)+'</div></div></div>';
      if(S.exp[k])r+='<div class="conn">'+a.dests.map(x=>'<div style="display:flex;justify-content:space-between;gap:8px"><span>'+L(x.d+':'+x.p)+' <span class="sub">'+esc(x.pr)+'</span></span><span>'+fmt(x.dn)+'</span></div>').join('')+'</div>';
      return r}).join('');
  }else{
    body=h.days.map(d=>'<div class="row" style="cursor:default"><div class="grow"><b>'+esc(d.j||d.day)+'</b><div class="sub">'+d.apps+' برنامه</div></div><div class="num"><b>'+fmt(d.dn)+'</b><div class="sub">'+fmt(d.up)+'</div></div></div>').join('')+'<div class="sub">جزئیات هر روز را در خود اپ ببین.</div>';
  }
  return '<h1>تاریخچهٔ مصرف\nاینترنت</h1><div class="pillsw"><button class="'+(S.hmode===0?'sel':'')+'" data-hm="0">۲۴ ساعت اخیر</button><button class="'+(S.hmode===1?'sel':'')+'" data-hm="1">روزها</button></div>'+body;
}

/* ---------- system ---------- */
function sSys(){
  const s=S.live.sys;if(!s)return wait();
  const m=S.live.meta||{};
  let body='';
  if(!s.granted)body='<div class="warn">دسترسی Usage access در گوشی فعال نیست؛ آمار سیستم قابل نمایش نیست.</div>';
  else{
    const used=s.apps.filter(a=>sum(a.rx)+sum(a.tx)>0);
    const bgApps=used.filter(a=>(a.rx[0]+a.rx[2])>1048576).length;
    body='<div class="card"><div style="display:flex;gap:20px"><div><div class="sub">برنامه‌های دارای مصرف</div><b style="font-size:22px">'+used.length+'</b></div><div><div class="sub">دانلود پس‌زمینه (بالای ۱ مگ)</div><b style="font-size:22px;color:var(--accent)">'+bgApps+'</b></div></div><div class="sub" style="margin-top:8px">کل دریافت پس‌زمینه '+fmt(sum(used.map(a=>a.rx[0]+a.rx[2])))+' • پیش‌زمینه '+fmt(sum(used.map(a=>a.rx[1]+a.rx[3])))+'</div></div>'+
    (s.outside&&s.outside.length?'<div class="card"><b style="color:var(--orange)">ترافیک خارج از رصد پایش</b>'+s.outside.map(o=>'<div class="kv"><span>'+esc(o.label)+'</span><b>'+fmt(o.b)+'</b></div>').join('')+'</div>':'')+
    used.map(a=>'<div class="row" style="cursor:default"><div class="av">'+esc(a.label.slice(0,1))+'</div><div class="grow"><b>'+esc(a.label)+'</b><div class="badges">'+((a.rx[0]+a.rx[1])>0?bd('وای‌فای '+fmt(a.rx[0]+a.rx[1])):'')+((a.rx[2]+a.rx[3])>0?bd('موبایل '+fmt(a.rx[2]+a.rx[3]),'o'):'')+(a.rx[0]+a.rx[2]>0?bd('پس‌زمینه '+fmt(a.rx[0]+a.rx[2]),'v'):'')+(a.sys?bd('سیستمی','g'):'')+'</div></div><div class="num"><b>'+fmt(sum(a.rx))+'</b><div class="sub">'+fmt(sum(a.tx))+'</div></div></div>').join('');
  }
  const lg=S.live.log&&S.live.log.lines||[];
  return '<h1>آمار سیستم\nبدون نیاز به VPN</h1><div class="sub">این آمار را خود اندروید جمع می‌کند (۲۴ ساعت اخیر).</div>'+
  '<div class="card"><div class="kv"><span>حافظهٔ اپ</span><b>'+(m.mem!=null?m.mem+' MB':'—')+'</b></div><div class="kv"><span>رشته‌ها</span><b>'+(m.threads!=null?m.threads:'—')+'</b></div></div>'+body+
  (lg.length?'<div class="card"><b>گزارش اپ</b><div class="sub ltr" style="white-space:pre-wrap;margin-top:6px;max-height:260px;overflow:auto">'+esc(lg.slice(-40).join('\n'))+'</div></div>':'');
}

/* ---------- cleaner ---------- */
function sClean(){
  const c=S.live.clean;if(!c)return wait();
  const st=['آماده','در حال اسکن','پایان'][c.state]||'—';
  return '<h1>پاکسازی\nفایل‌های تکراری</h1><div class="card"><div class="kv"><span>وضعیت</span><b>'+st+'</b></div>'+
  (c.state===1&&c.total>0?'<div class="prog" style="margin:8px 0"><i style="width:'+Math.min(100,Math.round(c.done*100/c.total))+'%"></i></div><div class="sub">'+esc(c.phase)+'</div>':'')+
  '<div class="kv"><span>گروه‌های تکراری</span><b>'+c.groups+'</b></div><div class="kv"><span>فضای قابل آزاد شدن</span><b style="color:var(--accent)">'+fmt(c.reclaim)+'</b></div>'+(c.note?'<div class="sub">'+esc(c.note)+'</div>':'')+'</div>'+
  c.top.map(g=>'<div class="row" style="cursor:default"><div class="grow"><b>'+g.n+' نسخه</b><div class="sub">هر نسخه '+fmt(g.size)+'</div></div><div class="num"><b>'+fmt(g.size*(g.n-1))+'</b></div></div>').join('')+
  '<div class="sub">نام و مسیر فایل‌ها عمداً ارسال نمی‌شود؛ فقط تعداد و حجم.</div>';
}

/* ---------- antivirus ---------- */
function sAv(){
  const a=S.live.av;if(!a)return wait();
  const sc=a.score,col=sc<0?'#2A2F24':sc>=80?'#C6F432':sc>=50?'#FFB23E':'#FF6B5E';
  const st=a.status,stn=['آماده','در حال اسکن','اسکن کامل شد'][st.state]||'—';
  const lv=['امن','مشکوک','خطرناک'],lc=['','o','r'];
  return '<h1>آنتی‌ویروس</h1><div class="card"><div class="score" style="background:conic-gradient('+col+' '+(sc<0?0:sc*3.6)+'deg,#2A2F24 0)"><div>'+(sc<0?'—':sc)+'</div></div><div style="text-align:center;margin-top:8px"><b>'+stn+'</b></div>'+
  (st.state===1&&st.total>0?'<div class="prog" style="margin:8px 0"><i style="width:'+Math.min(100,Math.round(st.done*100/st.total))+'%"></i></div><div class="sub">'+esc(st.phase)+' • '+st.done+'/'+st.total+'</div>':'')+(st.note?'<div class="sub">'+esc(st.note)+'</div>':'')+(a.note?'<div class="sub">'+esc(a.note)+'</div>':'')+'</div>'+
  '<div class="card"><div class="kv"><span>برنامه‌های بررسی‌شده</span><b>'+a.counts.apps+'</b></div><div class="kv"><span>فایل‌های بررسی‌شده</span><b>'+a.counts.files+'</b></div><div class="kv"><span>بررسی ابری</span><b>'+a.counts.cloud+'</b></div></div>'+
  '<div class="card"><b>محافظت لحظه‌ای</b><div class="kv"><span>وضعیت</span><b>'+(a.guard.running?'فعال':'خاموش')+'</b></div><div class="kv"><span>پوشه‌های زیر نظر</span><b>'+a.guard.watched+'</b></div><div class="kv"><span>رویدادهای فایل</span><b>'+a.guard.events+'</b></div><div class="kv"><span>نشانهٔ دستکاری سیستم</span><b>'+a.guard.integrity+'</b></div></div>'+
  (a.posture.length?'<div class="card"><b>وضعیت امنیتی دستگاه</b>'+a.posture.map(p=>'<div class="kv"><span>'+esc(p.t)+'<div class="sub">'+esc(p.d)+'</div></span>'+bd(p.ok?'سالم':(p.sev>=2?'بحرانی':'هشدار'),p.ok?'':(p.sev>=2?'r':'o'))+'</div>').join('')+'</div>':'')+
  (a.threats.length?'<div class="card"><b style="color:var(--orange)">تهدیدهای شبکه</b>'+a.threats.map(t=>'<div class="kv"><span>'+esc(t.label)+'<div class="sub">'+L(t.domain)+' • '+esc(t.family)+'</div></span></div>').join('')+'</div>':'')+
  '<b>یافته‌ها ('+a.findings.length+')</b>'+
  (a.findings.length?a.findings.map(f=>'<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b>'+esc(f.t)+'</b>'+bd(lv[f.lv]||'—',lc[f.lv]||'')+'</div><div class="sub">'+esc(f.s)+'</div>'+(f.path?'<div class="sub">'+L(f.path)+'</div>':f.pkg?'<div class="sub">'+L(f.pkg)+'</div>':'')+(f.rs&&f.rs.length?'<div class="sub" style="margin-top:4px">'+f.rs.map(esc).join(' • ')+'</div>':'')+'</div>').join(''):'<div class="empty">موردی پیدا نشده است.</div>')+
  (a.quarantine.length?'<div class="card"><b>قرنطینه ('+a.quarantine.length+')</b>'+a.quarantine.map(q=>'<div class="kv"><span>'+esc(q.name)+'</span><b>'+fmt(q.size)+'</b></div>').join('')+'</div>':'');
}

function render(){
  const f=[sLive,sHist,sSys,sClean,sAv][S.tab];
  const y=window.scrollY;
  $('#screen').innerHTML='<div class="tabs">'+TABS.map((t,i)=>'<button class="tab '+(i===S.tab?'sel':'')+'" data-tab="'+i+'">'+t+'</button>').join('')+'</div>'+(S.sel?f():wait());
  const t=S.live.traffic;
  $('#bar').innerHTML='<div class="grow"><b class="ltr" style="font-size:17px">↓ '+fmt(t?t.down:0)+'   ↑ '+fmt(t?t.up:0)+'</b><div class="sub">'+(t?(t.run?'رصد فعال • '+t.activeApps+' برنامه در حال ارتباط':'رصد خاموش'):'—')+'</div></div><div class="pill '+(t&&t.run?'':'off')+'">'+(t&&t.run?'رصد فعال':'رصد خاموش')+'</div>';
  window.scrollTo(0,y);renderSide();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-exp],[data-expk],[data-hm],[data-hf],.dev');if(!t)return;
  if(t.dataset.tab!=null)S.tab=+t.dataset.tab;
  else if(t.dataset.exp!=null)S.exp[t.dataset.exp]=!S.exp[t.dataset.exp];
  else if(t.dataset.expk!=null)S.exp[t.dataset.expk]=!S.exp[t.dataset.expk];
  else if(t.dataset.hm!=null)S.hmode=+t.dataset.hm;
  else if(t.dataset.hf!=null)S.hfilter=+t.dataset.hf;
  else if(t.classList.contains('dev')){select(t.dataset.id);return}
  render();
});
$('#cfgBtn').onclick=()=>{$('#apiBase').value=S.api;$('#apiTok').value=S.tok;$('#cfg').showModal()};
$('#close').onclick=()=>$('#cfg').close();
$('#save').onclick=()=>{
  S.api=$('#apiBase').value.trim().replace(/\/+$/,'');S.tok=$('#apiTok').value.trim();
  localStorage.setItem('payeshApiBase',S.api);localStorage.setItem('payeshApiToken',S.tok);
  $('#cfg').close();S.sel=null;S.devices=[];loadDevices().then(render);
};
render();renderConn();
if(!S.api||!S.tok)$('#cfg').showModal();else loadDevices().then(render);
setInterval(poll,1000);setInterval(loadDevices,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
</script>
</body>
</html>
