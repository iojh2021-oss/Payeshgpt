name: Android APK

on:
  push:
    branches: [main, "work/**"]
    paths:
      - "app/**"
      - "native/payesh-core/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "app/**"
      - "native/payesh-core/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-test:
    name: Test Rust security core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/payesh-core
      - name: Run Rust tests
        run: cargo test --manifest-path native/payesh-core/Cargo.toml

  assemble:
    name: Build Android ARM64 debug APK
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust library for Android ARM64
        working-directory: native/payesh-core
        run: cargo ndk -t arm64-v8a -o ../../app/src/main/jniLibs build --release
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: payeshgpt-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
