name: Rust security core
on:
  push:
    branches: [main, "work/**"]
    paths:
      - "native/payesh-core/**"
      - ".github/workflows/rust-core.yml"
  pull_request:
    paths:
      - "native/payesh-core/**"
      - ".github/workflows/rust-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/payesh-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test
